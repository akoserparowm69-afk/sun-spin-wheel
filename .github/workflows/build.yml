name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Prepare Required Files
        run: |
          yes | sdkmanager --licenses || true

          # 1. SDK Platform 36 & Build Tools
          sdkmanager "platforms;android-36" "build-tools;34.0.0" || true

          # 2. Generate required .env and .env.example files for Secrets Plugin
          touch .env .env.example
          touch app/.env app/.env.example

          # 3. Generate required debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # 4. Generate google-services.json for both possible package names
          mkdir -p app/src/main app/src/debug
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "1234567890", "project_id": "spinwheel-app" },
            "client": [
              {
                "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.aistudio.spinwheel.kwzqva" } },
                "oauth_client": [], "api_key": [], "services": {}
              },
              {
                "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.example" } },
                "oauth_client": [], "api_key": [], "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/main/google-services.json
          cp app/google-services.json app/src/debug/google-services.json

      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint -x roborazziDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spinwheel-app
          path: "**/build/outputs/apk/debug/*.apk"
