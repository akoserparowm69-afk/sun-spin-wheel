name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Prepare Config & Accurate JSON
        run: |
          yes | sdkmanager --licenses || true

          # Create exact google-services.json matching the package name
          mkdir -p app/src/main app/src/debug
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "spinwheel-app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.spinwheel.kwzqva"
                  }
                },
                "oauth_client": [],
                "api_key": [],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/main/google-services.json
          cp app/google-services.json app/src/debug/google-services.json

      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spinwheel-app
          path: "**/build/outputs/apk/debug/*.apk"
